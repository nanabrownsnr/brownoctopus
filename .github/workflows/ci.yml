name: Brown Octopus CI

on:
  push:
  pull_request:

jobs:
  tests:
    env:
      BROWN_OCTOPUS_ALLOW_MODEL_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Prepare spaCy test model
        run: python -m spacy download en_core_web_trf
      - name: Run tests
        run: python -m pytest -q -m "not external"

  package:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv release-env
          release-env/bin/python -m pip install dist/*.whl
          release-env/bin/python -c "from brown_octopus import Octopus; print(Octopus)"
          release-env/bin/brown-octopus --help
          release-env/bin/brown-octopus --version
