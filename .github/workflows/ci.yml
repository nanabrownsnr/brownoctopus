name: Brown Octopus CI

on:
  push:
  pull_request:

jobs:
  tests:
    env:
      BROWN_OCTOPUS_ALLOW_MODEL_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Hugging Face and Torch models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: qwen3-embedding-0.6b-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            qwen3-embedding-0.6b-${{ runner.os }}-${{ matrix.python }}-
      - name: Install project and test tools
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Prepare spaCy test model
        run: python -m spacy download en_core_web_trf
      - name: Prepare Qwen embedding test model
        env:
          BROWN_OCTOPUS_ALLOW_MODEL_DOWNLOAD: "1"
        run: >-
          python -c "from sentence_transformers import SentenceTransformer;
          SentenceTransformer('Qwen/Qwen3-Embedding-0.6B', trust_remote_code=True)"
      - name: Run tests
        env:
          BROWN_OCTOPUS_ALLOW_MODEL_DOWNLOAD: "1"
        run: python -m pytest -q -m "not external"

  package:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv release-env
          release-env/bin/python -m pip install dist/*.whl
          release-env/bin/python -c "from brown_octopus import Octopus; print(Octopus)"
          release-env/bin/brown-octopus --help
          release-env/bin/brown-octopus --version
