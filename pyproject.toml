[project]
name = "brown-octopus"
version = "0.5.3"
description = "Capability-context management for tool-using AI agents"
readme = "README.md"
authors = [{ name = "nana brown", email = "nanabrownsnr@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["AI agents", "MCP", "tool retrieval", "capability context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.3",
    "numpy>=2.2,<2.3",
    "packaging>=24.0",
    "sentence-transformers>=6.0.1",
    "spacy>=3.8.16",
]

[project.optional-dependencies]
toolret = ["pyarrow>=18.0.0"]
jev = ["jev-reranker>=0.1.0"]
service = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]
postgres = ["psycopg[binary]>=3.2.0"]
mongo = ["pymongo>=4.10.0"]

[project.scripts]
brown-octopus = "brown_octopus.cli:main"

[project.urls]
Repository = "https://github.com/nanabrownsnr/brownoctopus"
Documentation = "https://github.com/nanabrownsnr/brownoctopus/blob/main/docs/production.md"
Issues = "https://github.com/nanabrownsnr/brownoctopus/issues"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["external: requires a live external MCP service or network access"]
