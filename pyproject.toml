[project]
name = "octopus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nana brown", email = "nanabrownsnr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
    "numpy>=2.5.3",
    "sentence-transformers>=6.0.1",
    "spacy>=3.8.16",
]

[project.scripts]
octopus = "octopus:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
